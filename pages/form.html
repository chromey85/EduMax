<!doctype html>
<html lang="en">

<head>
  <title>EduMax Admin - Edit Announcement</title>
  <meta name="author" content="ya874" />
  <meta name="description" content="An online learning resource by students for students" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/bootstrap.min.css" />
  <!-- Bootstrap stylesheet -->
  <link rel="stylesheet" href="../css/custom.css" />
  <!-- Custom stylesheet -->
</head>

<body>
  <div class="container">
    <header class="header p-3">
      <!-- Logo and Title -->
      <div class="row align-items-center">
        <div class="col-auto">
          <img src="../images/EduMax_logo.png" alt="EduMax Logo" class="img-fluid"
            style="max-height: 80px; width: auto;">
        </div>
        <div class="col">
          <h1 class="header mb-0">EduMax Admin</h1>
        </div>
        <div class="col-auto d-flex align-items-center justify-content-end gap-3">
          <!-- login button -->
          <img src="../images/question.png" alt="Help" class="img-fluid" style="height: 38px; width: auto;">
          <img src="../images/bell.png" alt="notifications" class="img-fluid" style="height: 38px; width: auto;">
          <a class="btn btn-primary" href="./placeholder.html" role="button">Admin User</a>
        </div>
      </div>
    </header>
    <!-- Main Area -->
    <main class="my-4">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 mb-4">
          <div class="bg-light p3 border rounded">
            <h4 class="d-flex justify-content-around">Admin Menu</h4>
            <ul class="nav flex-column">
              <li class="nav-item mb-2"><a class="nav-link text-dark pb-2" href="./placeholder.html">Dashboard</a>
              </li>
              <li class="nav-item mb-2"><a class="nav-link text-dark pb-2" href="./placeholder.html">Students</a></li>
              <li class="nav-item mb-2"><a class="nav-link text-dark pb-2" href="./placeholder.html">Module
                  Catalogue</a></li>
              <li class="nav-item mb-2"><a class="nav-link text-dark pb-2" href="./placeholder.html">Learning Events</a>
              </li>
              <li class="nav-item mb-2"><a class="nav-link text-primary fw-bold pb-2 active" href="#">Announcements</a>
              </li>
              <li class="nav-item"><a class="nav-link text-dark pb-2" href="./placeholder.html">Security</a>
            </ul>
          </div>
        </div>

        <!-- Main Form Area-->
        <div class="col-md-9">
          <div class="p-4 border">
            <!-- Heading and Top-Right Submit Button Row -->
            <div class="row align-items-center mb-1">
              <div class="col">
                <h2 class="mb-0">Add Announcement</h2>
              </div>
              <div class="col-auto">
                <button type="submit" form="announcementForm" class="btn btn-success px-4">Add Announcement</button>
              </div>
            </div>
            <!-- Breadcrumbs -->
            <div class="row mt-1">
              <div class="col">
                <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                  <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="./placeholder.html">Home</a></li>
                    <li class="breadcrumb-item"><a href="./placeholder.html">Announcements</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Add Announcement</li>
                  </ol>
                </nav>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <footer>
      <div class="row mt-0 mt-4 border-top pt-3">
        <div class="col-md-6">
          <!-- Copyright on the left -->
          <p class="mb-0">&copy; 2026 EduMax. All rights reserved</p>
        </div>
        <div class="col-md-6">
          <!-- Navigation on the right -->
          <nav class="nav justify-content-md-end">
            <a class="nav-link" href="./placeholder.html">Privacy Policy</a>
            <a class="nav-link" href="./placeholder.html">Terms of Use</a>
          </nav>
        </div>
    </footer>
  </div>

  <!-- Bootstrap JavaScript -->
  <script src="../js/bootstrap.min.js"></script>
  <!-- Basic -->
  <script src="../js/bootstrap.bundle.min.js"></script>
  <!-- Extras e.g. dropdown menus -->
